{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LADA{% endblock %} | LADA</title>
    <link rel="icon" href="{% static 'lada/img/favicon.ico' %}" sizes="32x32">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Ropa+Sans:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'lada/css/site.css' %}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
        <a class="site-wordmark" href="{% url 'index' %}">
            <span class="wm-purple">L</span><span class="wm-gray">AD</span><span class="wm-pink">A</span><span class="wm-gray"> PROJECT</span>
        </a>
    </header>

    <main id="content" class="site-main">
        <div class="page-content">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-bar">
            <a class="footer-partner" href="https://www.swissuniversities.ch/themen/digitalisierung/wissenschaftliche-information-2017-2020" target="_blank" rel="noopener">
                <img src="{% static 'lada/img/swissuniversities-white.png' %}" alt="swissuniversities" width="200" height="23">
            </a>
            <a class="footer-usi" href="https://www.usi.ch/">
                <img src="{% static 'lada/img/bollino-usi-white.svg' %}" alt="Università della Svizzera italiana" width="52" height="52">
            </a>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
